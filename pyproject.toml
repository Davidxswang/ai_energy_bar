[project]
name = "ai-energy-bar"
version = "0.1.0"
description = "GNOME Shell extension probe for Claude Code, Codex CLI, and Gemini CLI quota status."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pexpect>=4.9.0",
]

[project.optional-dependencies]
# macOS menu bar front-end. The marker keeps `uv sync --extra macos` a no-op on
# Linux/CI, where rumps (PyObjC) cannot build.
macos = [
  "rumps>=0.4.0 ; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.13.0",
  "ty>=0.0.24",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
