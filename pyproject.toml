[project]
name = "ai-energy-bar"
version = "0.1.0"
description = "GNOME Shell extension probe for Claude Code, Codex CLI, and Gemini CLI quota status."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pexpect>=4.9.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.13.0",
  "ty>=0.0.24",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
